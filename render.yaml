# ClassPilot AI — Render deploy (backend). Connect repo, Render auto-detects.
# Dashboard → New → Blueprint → select repo. Set env vars below in dashboard.
services:
  - type: web
    name: classpilot-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: prod
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://classpilot.vercel.app (NO trailing slash)
      - key: AI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PROVIDER
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
